<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>공연 소식 작성 | 까투리</title><link rel="stylesheet" href="styles.css"><script src="schedule-data.js" defer></script><script src="firebase-config.js" defer></script><script src="firebase-members.js" defer></script><script src="manage-schedule.js" defer></script></head><body><main class="video-manager"><a href="index.html#performances">← 공연 소식</a><h1>공연 소식 작성</h1><p>관리자로 로그인해 공연 일정과 회원 안내를 바로 게시하세요.</p><p id="editor-message" role="status">Firebase 연결 준비 중입니다. 연결 후 관리자 계정으로 작성할 수 있습니다.</p><button id="admin-login" class="button" disabled>Google로 로그인</button><button id="admin-logout" class="button" hidden>로그아웃</button><form id="schedule-editor"><fieldset id="editor-fields" disabled><legend>공연 안내</legend><label for="edit-title">공연명 · 공개</label><input id="edit-title" required maxlength="150"><label for="edit-title-en">영문 공연명 · English title (선택)</label><input id="edit-title-en" maxlength="150"><label for="edit-date">공연 날짜 · 공개</label><input id="edit-date" type="date" required><label for="edit-time">공연 시간 · 공개</label><input id="edit-time" maxlength="100"><label><input id="edit-tentative" type="checkbox" style="width:auto"> 잠정 일정</label><h2>회원 전용 정보</h2><label for="private-place">만나는 장소</label><input id="private-place" maxlength="300"><label for="private-time">만나는 시간</label><input id="private-time" maxlength="150"><label for="dance-one">첫 번째 춤</label><input id="dance-one" required maxlength="100"><label for="dance-two">두 번째 춤 (선택)</label><input id="dance-two" maxlength="100"><label for="private-note">추가 안내</label><textarea id="private-note" maxlength="1000" rows="3"></textarea><button class="button" type="submit">웹사이트에 게시</button><button id="new-event" type="button">새 공연 작성</button></fieldset></form><section id="admin-list" hidden><h2>게시된 공연 목록</h2><div id="schedule-editor-list"></div></section></main></body></htm
