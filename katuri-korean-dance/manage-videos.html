<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>공연 영상 추가 | 까투리</title><link rel="stylesheet" href="styles.css"><script src="youtube.js" defer></script><script src="videos.js" defer></script><script src="firebase-config.js" defer></script><script src="firebase-members.js" defer></script><script src="manage-videos.js" defer></script></head><body><main class="video-manager"><a href="index.html#gallery">← 공연 영상</a><h1>공연 영상 추가</h1><p>관리자로 로그인한 뒤 제목과 유튜브 링크를 입력하면 홈페이지에 바로 게시됩니다.</p><p id="manager-status" role="status">Firebase 연결 준비 중입니다.</p><button id="video-login" class="button" disabled>Google로 로그인</button><button id="video-logout" class="button" hidden>로그아웃</button><form id="video-form"><fieldset id="video-fields" disabled><legend>유튜브 공연 영상</legend><label for="video-title">영상 제목</label><input id="video-title" required maxlength="150"><label for="video-url">유튜브 링크</label><input id="video-url" type="url" required placeholder="https://youtu.be/…"><label for="video-description">설명 (선택)</label><input id="video-description" maxlength="300"><button class="button" type="submit">웹사이트에 영상 게시</button></fieldset></form><h2>게시된 영상</h2><p>영상을 끌어서 옮기거나 위·아래 버튼으로 이동한 뒤 순서를 저장하세요. 새 영상은 맨 앞에 추가됩니다.</p><button id="save-video-order" class="button" disabled>순서 저장</button><ol id="manager-list"></ol></main></body></html>
